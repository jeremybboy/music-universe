name: Verify and deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: music-universe-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-web:
    name: Verify production web player
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: npm exec -- playwright install --with-deps --only-shell chromium
      - run: npm run test:browser -- --pages
      - name: Upload the verified web build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  verify-macos:
    name: Verify standalone Mac build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build:macos

  deploy:
    name: Deploy verified site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify-web, verify-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-live:
    name: Verify public player URL
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch the published page and its assets
        shell: bash
        run: |
          origin=https://jeremybboy.github.io
          index="$RUNNER_TEMP/music-universe-index.html"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 4 --max-time 10 \
            "$origin/music-universe/" --output "$index"
          grep -Fq '<title>Music Universe | Afterimage</title>' "$index"
          for extension in js css; do
            asset=$(grep -m 1 -oE "/music-universe/assets/[^\"]+\.$extension" "$index")
            curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 4 --max-time 10 \
              "$origin$asset" --output /dev/null
          done
